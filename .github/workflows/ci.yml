name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: https://israel-election-results.vercel.app
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm data:validate
      - run: pnpm build
      - run: pnpm bundle:report
      - run: pnpm release:check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:chromium
